name: Midnight Project CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile-contracts:
    name: 1 · Compile Compact contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@11.1.2
      - name: Install Compact CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: compact update 0.30
      - run: pnpm install
      - run: pnpm run compile-contracts

  node-verification:
    name: 2 · Test Node integration
    runs-on: ubuntu-latest
    needs: compile-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@11.1.2
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build

  ui-verification:
    name: 3 · Verify UI & Build
    runs-on: ubuntu-latest
    needs: node-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@11.1.2
      - run: |
          if [ -d "ui" ]; then
            pnpm --filter ui install
            pnpm --filter ui run build
          fi
